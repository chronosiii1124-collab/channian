<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060a0b" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      try {
        const stored = localStorage.getItem('channian-theme') || 'night';
        const alias = { ember: 'grain', tide: 'matte', dusk: 'matte' };
        document.documentElement.dataset.theme = ['night', 'grain', 'matte', 'paper'].includes(stored)
          ? stored
          : (alias[stored] || 'night');
      } catch (error) {
        document.documentElement.dataset.theme = 'night';
      }
    </script>
    <title>馋念 · 城市觅食地图</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
